name: Notify PR Check From Fork Run

on:
  workflow_call:
    inputs:
      source_workflow_id:
        required: true
        type: string
        description: Workflow file name to query in the fork repository.
      upstream_check_name:
        required: true
        type: string
        description: Check-run name to create in the upstream repository.
      details_check_run_name:
        required: true
        type: string
        description: Check-run name to link in check summary.

jobs:
  notify:
    name: Notify
    runs-on: ubuntu-slim
    permissions:
      actions: read
      checks: write
    steps:
      - name: Notify
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const endpoint = 'GET /repos/:owner/:repo/actions/workflows/:id/runs?&branch=:branch'
            const check_run_endpoint = 'GET /repos/:owner/:repo/commits/:ref/check-runs?per_page=100'

            const detailsCheckRunName = '${{ inputs.details_check_run_name }}'.trim()
            const initialWaitMs = 3000
            const retryAttempts = 3
            const retryDelayMs = 3000

            if (!detailsCheckRunName) {
              throw new Error("Invalid input: 'details_check_run_name' must be non-empty")
            }

            // TODO: Should use pull_request.user and pull_request.user.repos_url?
            // If a different person creates a commit to another forked repo,
            // it wouldn't be able to detect.
            const params = {
              owner: context.payload.pull_request.head.repo.owner.login,
              repo: context.payload.pull_request.head.repo.name,
              id: '${{ inputs.source_workflow_id }}',
              branch: context.payload.pull_request.head.ref,
            }
            const check_run_params = {
              owner: context.payload.pull_request.head.repo.owner.login,
              repo: context.payload.pull_request.head.repo.name,
              ref: context.payload.pull_request.head.ref,
            }

            console.log('Ref: ' + context.payload.pull_request.head.ref)
            console.log('SHA: ' + context.payload.pull_request.head.sha)

            // Wait to make sure the fork repository triggered a run.
            await new Promise(r => setTimeout(r, initialWaitMs))

            let runs
            try {
              runs = await github.request(endpoint, params)
            } catch (error) {
              console.error(error)
              // Assume that runs were not found.
            }

            const name = '${{ inputs.upstream_check_name }}'
            const head_sha = context.payload.pull_request.head.sha
            let status = 'queued'

            if (!runs || runs.data.workflow_runs.length === 0) {
              status = 'completed'
              const conclusion = 'action_required'

              github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: name,
                head_sha: head_sha,
                status: status,
                conclusion: conclusion,
                output: {
                  title: 'Run detection failed',
                  summary: `
            Unable to detect the run for testing the changes in your PR.

            1. If you did not enable GitHub Actions in your forked repository, please enable it by clicking the button as shown in the image below. See also [Managing Github Actions Settings for a repository](https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/enabling-features-for-your-repository/managing-github-actions-settings-for-a-repository) for more details.
            2. It is possible your branch is based on the old \`trunk\` branch in Apache Hadoop, please sync your branch to the latest trunk branch. For example as below:
                \`\`\`bash
                git fetch upstream
                git rebase upstream/trunk
                git push origin YOUR_BRANCH --force
                \`\`\``,
                  images: [
                    {
                      alt: 'enabling workflows button',
                      image_url: 'https://raw.githubusercontent.com/apache/hadoop/trunk/.github/workflows/images/workflow-enable-button.png'
                    }
                  ]
                }
              })
            } else {
              const run_id = runs.data.workflow_runs[0].id

              // Here we get check run ID for a Check run view instead of Actions view. See HADOOP-19858.
              if (runs.data.workflow_runs[0].head_sha != context.payload.pull_request.head.sha) {
                throw new Error('There was a new unsynced commit pushed. Please retrigger the run.')
              }

              let retryCount = 0
              let check_run_head
              while (retryCount < retryAttempts) {
                const check_runs = await github.request(check_run_endpoint, check_run_params)
                check_run_head = check_runs.data.check_runs.find(r => r.name === detailsCheckRunName)
                if (check_run_head) {
                  break
                }
                retryCount++
                if (retryCount < retryAttempts) {
                  await new Promise(resolve => setTimeout(resolve, retryDelayMs))
                }
              }
              if (!check_run_head) {
                throw new Error('Failed to retrieve check_run_head after retries')
              }

              if (check_run_head.head_sha != context.payload.pull_request.head.sha) {
                throw new Error('There was a new unsynced commit pushed. Please retrigger the run.')
              }

              const check_run_url = 'https://github.com/'
                + context.payload.pull_request.head.repo.full_name
                + '/runs/'
                + check_run_head.id
              console.log('Check run URL: ' + check_run_url)

              const actions_url = 'https://github.com/'
                + context.payload.pull_request.head.repo.full_name
                + '/actions/runs/'
                + run_id
              console.log('Actions URL: ' + actions_url)

              github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: name,
                head_sha: head_sha,
                status: status,
                output: {
                  title: 'Test results',
                  summary: '[See test results](' + check_run_url + ')',
                  text: JSON.stringify({
                    owner: context.payload.pull_request.head.repo.owner.login,
                    repo: context.payload.pull_request.head.repo.name,
                    run_id: run_id
                  })
                },
                details_url: actions_url,
              })
            }
